name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only PyTorch keeps the job small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Run unit tests and docstring examples
        run: python -m pytest
      - name: Check the HTML documentation builds
        run: python -m pdoc --docformat google --math -o /tmp/api sensorfill
