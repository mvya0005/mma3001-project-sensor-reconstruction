[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorfill"
version = "1.0.0"
description = "Reconstructing missing building-sensor measurements with numerical methods and machine learning (MMA3001 project)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Malay (GitHub: mvya0005)" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyarrow>=12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
deep = ["torch>=2.1"]
dev = ["pytest>=7", "pytest-html>=4", "pdoc>=14", "nbformat>=5", "nbclient>=0.8", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running tests (deep learning)"]
